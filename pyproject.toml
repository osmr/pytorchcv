[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorchcv"
description = "Computer vision models for PyTorch"
authors = [{name = "Oleg Sémery", email = "osemery@gmail.com"}]
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
keywords = [
    "machine-learning", "deep-learning", "neuralnetwork", "image-classification", "pytorch", "imagenet", "cifar",
    "svhn", "vgg", "resnet", "pyramidnet", "diracnet", "densenet", "condensenet", "wrn", "drn", "dpn", "darknet",
    "fishnet", "espnetv2", "xdensnet", "squeezenet", "squeezenext", "shufflenet", "menet", "mobilenet", "igcv3",
    "mnasnet", "darts", "xception", "inception", "polynet", "nasnet", "pnasnet", "ror", "proxylessnas", "dianet",
    "efficientnet", "mixnet", "image-segmentation", "voc", "ade20k", "cityscapes", "coco", "pspnet", "deeplabv3",
    "fcn",
]
dependencies = ["requests", "numpy", "torch", "torchvision"]
requires-python = ">=3.10"
urls = {Homepage = "https://github.com/osmr/pytorchcv"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["others", "*.others", "others.*", "*.others.*", "tests", "tests.*"]

[tool.setuptools.package-data]
"pytorchcv.models.common" = ["model_metainfos.csv"]

[tool.setuptools.dynamic]
version = {attr = "pytorchcv.__version__"}
